services:

  overseerr:
    container_name: ${CONTAINER_NAME}

    image: lscr.io/linuxserver/overseerr:${IMAGE_TAG}

    restart: unless-stopped

    ports:
      - "${HTTP_PORT}:5055"

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

    volumes:
      - ${CONFIG_PATH}:/config

    networks:
      - wooglenet

networks:
  wooglenet:
    external: true