services:

  radarr:
    container_name: ${CONTAINER_NAME}

    image: lscr.io/linuxserver/radarr:${IMAGE_TAG}

    restart: unless-stopped

    network_mode: "service:gluetun"

    depends_on:
      - gluetun
    ports:
      - "${HTTP_PORT}:7878"

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

    volumes:
      - ${CONFIG_PATH}:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads


networks:
  wooglenet:
    external: true