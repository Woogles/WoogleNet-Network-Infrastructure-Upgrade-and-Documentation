###############################################################################
#
# WoogleNet Backup Configuration
#
# Purpose:
# Centralized backup and recovery configuration.
#
# Used By:
#
# - validate-backups.sh
# - validate-recovery.sh
# - generate-capacity-report.sh
# - generate-compliance-report.sh
# - generate-certification-package.sh
#
# Authority:
#
# - BACKUP-AND-RESTORE.md
# - STORAGE-ARCHITECTURE.md
# - RECOVERY-TIME-OBJECTIVES.md
# - DISASTER-RECOVERY.md
#
###############################################################################

###############################################################################
# Backup Platform
###############################################################################

BACKUP_PLATFORM="Kopia"

BACKUP_HOST="JAX"

###############################################################################
# Repository Configuration
###############################################################################

BACKUP_REPOSITORY_NAME="wooglenet-primary"

BACKUP_REPOSITORY_PATH="/storage/backups/kopia"

BACKUP_REPOSITORY_TYPE="filesystem"

###############################################################################
# Storage Paths
###############################################################################

STORAGE_ROOT="/storage"

APPDATA_PATH="/storage/appdata"

MEDIA_PATH="/storage/media"

PHOTOS_PATH="/storage/photos"

DOCUMENTS_PATH="/storage/documents"

BACKUP_PATH="/storage/backups"

###############################################################################
# Offsite Replication
###############################################################################

OFFSITE_PROVIDER="OneDrive"

OFFSITE_ENABLED="true"

OFFSITE_SYNCTHING_ENABLED="false"

###############################################################################
# Retention Policy
###############################################################################

RETENTION_HOURLY=24

RETENTION_DAILY=30

RETENTION_WEEKLY=12

RETENTION_MONTHLY=12

RETENTION_YEARLY=3

###############################################################################
# Recovery Objectives
###############################################################################

###############################################################################
# Tier 1
###############################################################################

TIER1_TARGET_RTO_HOURS=4

TIER1_TARGET_RPO_HOURS=24

###############################################################################
# Tier 2
###############################################################################

TIER2_TARGET_RTO_HOURS=24

TIER2_TARGET_RPO_HOURS=168

###############################################################################
# Tier 3
###############################################################################

TIER3_TARGET_RTO_HOURS=72

TIER3_TARGET_RPO_HOURS=168

###############################################################################
# Validation Thresholds
###############################################################################

SNAPSHOT_WARNING_DAYS=1

SNAPSHOT_CRITICAL_DAYS=7

REPOSITORY_WARNING_PERCENT=80

REPOSITORY_CRITICAL_PERCENT=90

###############################################################################
# Backup Classifications
###############################################################################

TIER1_BACKUP_SERVICES=(
  "Vaultwarden"
  "Home Assistant"
  "Immich"
  "Paperless-ngx"
  "Nextcloud"
  "BookStack"
  "OpenMediaVault"
)

TIER2_BACKUP_SERVICES=(
  "Homepage"
  "Uptime Kuma"
  "Audiobookshelf"
  "Navidrome"
  "Syncthing"
)

TIER3_BACKUP_SERVICES=(
  "Plex"
  "Tautulli"
  "MeTube"
  "qBittorrent"
  "Sonarr"
  "Radarr"
  "Lidarr"
  "Readarr"
  "Bazarr"
  "Prowlarr"
  "Overseerr"
  "Gluetun"
  "Stirling-PDF"
)

###############################################################################
# Backup Locations
###############################################################################

VAULTWARDEN_BACKUP_PATH="/storage/appdata/vaultwarden"

HOMEASSISTANT_BACKUP_PATH="/storage/appdata/homeassistant"

IMMICH_BACKUP_PATH="/storage/photos"

PAPERLESS_BACKUP_PATH="/storage/documents"

NEXTCLOUD_BACKUP_PATH="/storage/documents"

BOOKSTACK_BACKUP_PATH="/storage/appdata/bookstack"

OMV_BACKUP_PATH="/storage"

###############################################################################
# Validation Requirements
###############################################################################

REQUIRE_REPOSITORY_ACCESS="true"

REQUIRE_SNAPSHOTS="true"

REQUIRE_RESTORE_CATALOG="true"

REQUIRE_OFFSITE_REPLICATION="true"

###############################################################################
# Certification Requirements
###############################################################################

CERT_REQUIRE_BACKUP_VALIDATION="true"

CERT_REQUIRE_RESTORE_VALIDATION="true"

CERT_REQUIRE_OFFSITE_VALIDATION="true"

CERT_REQUIRE_RETENTION_VALIDATION="true"

###############################################################################
# Reporting Thresholds
###############################################################################

BACKUP_HEALTH_PASS=0

BACKUP_HEALTH_WARN=1

BACKUP_HEALTH_FAIL=2

###############################################################################
# Recovery Validation
###############################################################################

RESTORE_TEST_FREQUENCY="Quarterly"

DISASTER_RECOVERY_TEST_FREQUENCY="Annual"

###############################################################################
# Report Locations
###############################################################################

BACKUP_REPORT_DIR="/opt/wooglenet/reports/backups"

RECOVERY_REPORT_DIR="/opt/wooglenet/reports/recovery"

CERTIFICATION_REPORT_DIR="/opt/wooglenet/reports/certification"