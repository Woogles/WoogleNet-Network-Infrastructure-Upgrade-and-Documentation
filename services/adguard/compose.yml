services:

  adguard:

    container_name: ${CONTAINER_NAME}

    image: adguard/adguardhome:${IMAGE_TAG}

    hostname: ${HOSTNAME}

    restart: unless-stopped

    env_file:
      - .env

    security_opt:
      - no-new-privileges:true

    ports:
      - "${DNS_PORT}:53/tcp"
      - "${DNS_PORT}:53/udp"

      - "${HTTP_PORT}:80/tcp"
      - "${HTTPS_PORT}:443/tcp"

      - "${ADMIN_PORT}:3000/tcp"

    volumes:
      - ${WORK_PATH}:/opt/adguardhome/work
      - ${CONF_PATH}:/opt/adguardhome/conf

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - wooglenet

networks:

  wooglenet:
    external: true