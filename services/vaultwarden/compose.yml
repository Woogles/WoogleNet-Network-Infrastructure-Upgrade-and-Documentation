services:

  vaultwarden:

    container_name: ${CONTAINER_NAME}

    image: vaultwarden/server:${IMAGE_TAG}

    hostname: vaultwarden

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DOMAIN: ${DOMAIN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      WEBSOCKET_ENABLED: ${WEBSOCKET_ENABLED}
      LOG_LEVEL: ${LOG_LEVEL}

    ports:
      - "${HTTP_PORT}:80"

    volumes:
      - ${DATA_PATH}:/data

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/alive"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true

    networks:
      - wooglenet

networks:

  wooglenet:
    external: true