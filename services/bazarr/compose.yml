services:

  bazarr:
    container_name: ${CONTAINER_NAME}

    image: lscr.io/linuxserver/bazarr:${IMAGE_TAG}

    restart: unless-stopped

    network_mode: "service:gluetun"

    depends_on:
      - gluetun

    ports:
      - "${HTTP_PORT}:6767"

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

    volumes:
      - ${CONFIG_PATH}:/config
      - ${MOVIES_PATH}:/movies
      - ${TV_PATH}:/tv


networks:
  wooglenet:
    external: true