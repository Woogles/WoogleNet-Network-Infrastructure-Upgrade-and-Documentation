services:

  audiobookshelf:

    container_name: ${CONTAINER_NAME}

    image: ghcr.io/advplyr/audiobookshelf:${IMAGE_TAG}

    hostname: audiobookshelf

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}

    ports:
      - "${HTTP_PORT}:80"

    volumes:
      - ${CONFIG_PATH}:/config
      - ${METADATA_PATH}:/metadata
      - ${AUDIOBOOKS_PATH}:/audiobooks:ro
      - ${PODCASTS_PATH}:/podcasts:ro

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:80"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    networks:
      - wooglenet

networks:

  wooglenet:
    external: true