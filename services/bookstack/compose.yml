services:

  mariadb:

    container_name: ${DB_CONTAINER_NAME}

    image: mariadb:${DB_IMAGE_TAG}

    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ${DB_DATA_PATH}:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - wooglenet

  bookstack:

    container_name: ${CONTAINER_NAME}

    image: lscr.io/linuxserver/bookstack:${IMAGE_TAG}

    restart: unless-stopped

    depends_on:

      mariadb:
        condition: service_healthy

    env_file:
      - .env

    environment:

      PUID: ${PUID}
      PGID: ${PGID}

      TZ: ${TZ}

      APP_URL: ${APP_URL}

      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${HTTP_PORT}:80"

    volumes:
      - ${CONFIG_PATH}:/config

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - wooglenet

networks:

  wooglenet:
    external: true
