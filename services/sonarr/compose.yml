services:

  sonarr:
    container_name: ${CONTAINER_NAME}

    image: lscr.io/linuxserver/sonarr:${IMAGE_TAG}

    restart: unless-stopped

    ports:
      - "${HTTP_PORT}:8989"

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

    volumes:
      - ${CONFIG_PATH}:/config
      - ${TV_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads

    network_mode: service:gluetun


networks:
  wooglenet:
    external: true