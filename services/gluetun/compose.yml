services:

  gluetun:

    container_name: ${CONTAINER_NAME}

    image: qmcgaw/gluetun:${IMAGE_TAG}

    hostname: gluetun

    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    env_file:
      - .env

    environment:
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER}
      VPN_TYPE: wireguard

      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}

      SERVER_COUNTRIES: ${VPN_COUNTRY}

      TZ: ${TZ}

    ports:

      # qBittorrent
      - "8080:8080"

      # Prowlarr
      - "9696:9696"

      # Sonarr
      - "8989:8989"

      # Radarr
      - "7878:7878"

      # Lidarr
      - "8686:8686"

      # Readarr
      - "8787:8787"

      # Bazarr
      - "6767:6767"

    healthcheck:
      test:
        [
          "CMD",
          "/gluetun-entrypoint",
          "healthcheck"
        ]
      interval: 30s
      timeout: 10s
      retries: 5

    security_opt:
      - no-new-privileges:true

    networks:
      - wooglenet

networks:

  wooglenet:
    external: true