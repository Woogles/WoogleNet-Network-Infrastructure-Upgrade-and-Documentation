version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    restart: always
    volumes:
      - ./postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    networks:
      - ${DOCKER_NETWORK_NAME}

  redis:
    image: redis:alpine
    restart: always
    networks:
      - ${DOCKER_NETWORK_NAME}

  server:
    image: ghcr.io/goauthentik/server:latest
    restart: always
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
    networks:
      - ${DOCKER_NETWORK_NAME}

  worker:
    image: ghcr.io/goauthentik/server:latest
    restart: always
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
    networks:
      - ${DOCKER_NETWORK_NAME}

networks:
  wooglenet_core:
    external: true
