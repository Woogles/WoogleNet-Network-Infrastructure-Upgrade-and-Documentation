###############################################################################
#
# WoogleNet Environment Configuration
#
# Purpose:
# Global environment configuration used by all automation,
# deployment, reporting, validation, recovery, and certification
# scripts.
#
# Used By:
#
# - validate-environment.sh
# - validate-services.sh
# - validate-backups.sh
# - validate-monitoring.sh
# - validate-recovery.sh
#
# - deploy-service.sh
# - update-service.sh
# - rollback-service.sh
#
# - generate-service-report.sh
# - generate-capacity-report.sh
# - generate-compliance-report.sh
# - generate-certification-package.sh
#
# Authority:
#
# - ARCHITECTURE.md
# - NETWORK-ARCHITECTURE.md
# - DNS-ARCHITECTURE.md
# - VPN-ARCHITECTURE.md
# - STORAGE-ARCHITECTURE.md
#
###############################################################################

###############################################################################
# ENVIRONMENT INFORMATION
###############################################################################

ENVIRONMENT_NAME="WoogleNet"

ENVIRONMENT_TYPE="Production"

ENVIRONMENT_VERSION="1.0"

ENVIRONMENT_OWNER="Eric Yacoub"

ENVIRONMENT_TIMEZONE="America/New_York"

###############################################################################
# ROOT PATHS
###############################################################################

WOOGLENET_ROOT="/opt/wooglenet"

CONFIG_DIR="${WOOGLENET_ROOT}/automation/config"

DOCS_DIR="${WOOGLENET_ROOT}/docs"

SERVICES_DIR="${WOOGLENET_ROOT}/services"

AUTOMATION_DIR="${WOOGLENET_ROOT}/automation"

SCRIPTS_DIR="${WOOGLENET_ROOT}/scripts"

REPORT_DIR="${WOOGLENET_ROOT}/reports"

LOG_DIR="${WOOGLENET_ROOT}/logs"

TEMP_DIR="${WOOGLENET_ROOT}/tmp"

###############################################################################
# REPORT DIRECTORIES
###############################################################################

COMPLIANCE_REPORT_DIR="${REPORT_DIR}/compliance"

CAPACITY_REPORT_DIR="${REPORT_DIR}/capacity"

SERVICE_REPORT_DIR="${REPORT_DIR}/services"

BACKUP_REPORT_DIR="${REPORT_DIR}/backups"

RECOVERY_REPORT_DIR="${REPORT_DIR}/recovery"

CERTIFICATION_REPORT_DIR="${REPORT_DIR}/certification"

VALIDATION_REPORT_DIR="${REPORT_DIR}/validation"

###############################################################################
# LOGGING
###############################################################################

LOG_RETENTION_DAYS=90

ENABLE_CONSOLE_LOGGING="true"

ENABLE_FILE_LOGGING="true"

LOG_LEVEL="INFO"

###############################################################################
# NETWORK
###############################################################################

LOCAL_DOMAIN="local"

MANAGEMENT_VLAN="10"

TRUSTED_VLAN="20"

IOT_VLAN="30"

GUEST_VLAN="40"

###############################################################################
# DNS
###############################################################################

PRIMARY_DNS="10.0.10.50"

SECONDARY_DNS="10.0.10.51"

DNS_TEST_DOMAINS=(
    "google.com"
    "microsoft.com"
    "github.com"
)

###############################################################################
# STORAGE
###############################################################################

STORAGE_ROOT="/storage"

APPDATA_ROOT="/storage/appdata"

MEDIA_ROOT="/storage/media"

PHOTOS_ROOT="/storage/photos"

DOCUMENTS_ROOT="/storage/documents"

DOWNLOADS_ROOT="/storage/downloads"

BACKUP_ROOT="/storage/backups"

###############################################################################
# CERTIFICATION SETTINGS
###############################################################################

CERTIFICATION_REQUIRED="true"

CERTIFICATION_REVIEW_MONTH="January"

CERTIFICATION_VALIDITY_DAYS=365

###############################################################################
# VALIDATION SETTINGS
###############################################################################

ENVIRONMENT_VALIDATION_ENABLED="true"

SERVICES_VALIDATION_ENABLED="true"

BACKUP_VALIDATION_ENABLED="true"

MONITORING_VALIDATION_ENABLED="true"

RECOVERY_VALIDATION_ENABLED="true"

###############################################################################
# MONITORING SETTINGS
###############################################################################

CERTIFICATE_WARNING_DAYS=30

CERTIFICATE_CRITICAL_DAYS=7

STORAGE_WARNING_PERCENT=80

STORAGE_CRITICAL_PERCENT=90

###############################################################################
# RECOVERY SETTINGS
###############################################################################

ENABLE_RECOVERY_VALIDATION="true"

ENABLE_RESTORE_TEST_VALIDATION="true"

ENABLE_BACKUP_VALIDATION="true"

###############################################################################
# DOCKER SETTINGS
###############################################################################

COMPOSE_FILE_NAME="compose.yml"

ENV_FILE_NAME=".env"

ENV_EXAMPLE_NAME=".env.example"

README_FILE_NAME="README.md"

###############################################################################
# DEPLOYMENT SETTINGS
###############################################################################

AUTO_PULL_IMAGES="true"

AUTO_VALIDATE_AFTER_DEPLOYMENT="true"

AUTO_GENERATE_REPORTS="true"

AUTO_ROLLBACK_ON_FAILURE="false"

###############################################################################
# REPORT OUTPUT SETTINGS
###############################################################################

REPORT_DATE_FORMAT="%Y-%m-%d"

REPORT_TIMESTAMP_FORMAT="%Y-%m-%d %H:%M:%S"

OUTPUT_FORMAT="text"

###############################################################################
# AUTOMATION FRAMEWORK VERSION
###############################################################################

AUTOMATION_FRAMEWORK_VERSION="1.0"

###############################################################################
# CONFIGURATION FILES
###############################################################################

SERVICES_CONFIG="${CONFIG_DIR}/services.conf"

HOSTS_CONFIG="${CONFIG_DIR}/hosts.conf"

BACKUP_CONFIG="${CONFIG_DIR}/backup.conf"

MONITORING_CONFIG="${CONFIG_DIR}/monitoring.conf"

###############################################################################
# END OF FILE
###############################################################################